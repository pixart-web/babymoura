; Ajustes locais. Em produção, validar com o alojamento.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60
; Não registar dados pessoais: os erros vão para o stderr do contentor sem payloads de formulário.
display_errors = Off
log_errors = On
